# ABOUTME: Pre-commit hooks - Python lint/format/tests/coverage, plus frontend
# ABOUTME: tests/coverage when frontend files change. See docs/getting-started.md.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format (python)
        entry: uv run ruff format --check
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-check
        name: ruff check (python lint)
        entry: uv run ruff check
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-coverage
        name: pytest with coverage floor (python)
        entry: uv run pytest --cov --cov-report=term-missing
        language: system
        types: [python]
        pass_filenames: false

      - id: frontend-tests
        name: frontend vitest suite with coverage floor
        entry: bash -c 'cd frontend && npm run test:coverage'
        language: system
        files: ^frontend/
        pass_filenames: false
